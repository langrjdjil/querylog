[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "langrjdjil-querylog"
version = "0.1.0"
description = "给检索过程留痕，区分「没有」与「没查到」"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "langrjdjil" }]
keywords = ["search", "reproducibility", "logging", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/langrjdjil/querylog"
Repository = "https://github.com/langrjdjil/querylog"
Issues = "https://github.com/langrjdjil/querylog/issues"

[project.scripts]
querylog = "querylog:main"

[tool.setuptools]
py-modules = ["querylog"]
